services:
  claude-headroom:
    image: grafana-jsm-sandbox:latest
    container_name: claude-headroom
    entrypoint: ["sleep", "infinity"]
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - default
networks:
  default:
    name: opentelemetry-demo
    external: true
