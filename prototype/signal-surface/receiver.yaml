# Stands in for the Receiver pod and one Run, at this repo's own 2 GiB cap
# (ADR 0007 moves both into the cluster). The prototype only needs the
# RESERVATION to be real — what it runs is irrelevant to the capacity question.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  labels: { app: receiver }
spec:
  replicas: 1
  selector: { matchLabels: { app: receiver } }
  template:
    metadata:
      labels: { app: receiver }
    spec:
      containers:
        - name: receiver
          image: python:3.13-slim
          command: ["python","-c"]
          args:
            - |
              import http.server, socketserver
              class H(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      n=int(self.headers.get("content-length",0)); self.rfile.read(n)
                      self.send_response(202); self.end_headers()
                  def do_GET(self):
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
                  def log_message(self,*a): pass
              socketserver.TCPServer(("",8080),H).serve_forever()
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
spec:
  type: ClusterIP
  selector: { app: receiver }
  ports: [{ port: 8080, targetPort: 8080 }]
