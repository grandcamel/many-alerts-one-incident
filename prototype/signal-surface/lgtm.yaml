# The LGTM stack in-cluster, the same grafana/otel-lgtm image ticket 08 measured
# on the laptop. Not exposed: ClusterIP only, reached by `kubectl port-forward`
# (ADR 0007 — nothing is public, and anonymous Grafana access goes away).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels: { app: lgtm }
spec:
  replicas: 1
  selector: { matchLabels: { app: lgtm } }
  template:
    metadata:
      labels: { app: lgtm }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.11.4
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: loki, containerPort: 3100 }
            - { name: prom, containerPort: 9090 }
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  type: ClusterIP
  selector: { app: lgtm }
  ports:
    - { name: grafana,   port: 3000, targetPort: 3000 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: loki,      port: 3100, targetPort: 3100 }
    - { name: prom,      port: 9090, targetPort: 9090 }
