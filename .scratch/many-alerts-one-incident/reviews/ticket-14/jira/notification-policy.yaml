# The notification policy: one route, everything to the Receiver, on demo
# timescales (story 54).
#
# Grafana's default repeat interval is four hours. Left alone, the Alert would
# fire once and the repeat Firings that add trend comments to the Incident would
# never arrive during the demo. `repeat_interval: 1m` is the override, and the
# spec calls it the most likely thing to be lost if this stack is rebuilt from
# the grafana/docker-otel-lgtm repo it came from. The group wait and interval are short for the same reason: the
# first Notification and the Resolved should each follow the rule's state change
# within seconds, not minutes.
apiVersion: 1

policies:
  - orgId: 1
    receiver: demo-receiver
    group_by:
      - grafana_folder
      - alertname
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1m
